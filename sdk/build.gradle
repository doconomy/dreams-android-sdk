plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'org.jetbrains.dokka'
    id 'signing'
    id 'com.vanniktech.maven.publish' version '0.29.0'
}

import com.vanniktech.maven.publish.AndroidSingleVariantLibrary
import com.vanniktech.maven.publish.SonatypeHost

android {
    compileSdkVersion 36

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 36
        versionName '1.0.0'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }


    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    packaging {
        resources {
            excludes += [
                'META-INF/LICENSE.md',
                'META-INF/LICENSE-notice.md',
                'META-INF/NOTICE.md'
            ]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
    namespace 'com.getdreams'
    testNamespace 'com.getdreams.androidtest'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:${kotlin_version}"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.7.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'androidx.test:runner:1.6.1'
    testImplementation 'androidx.test.ext:junit:1.2.1'
    testImplementation 'org.robolectric:robolectric:4.16.1'

    androidTestImplementation 'androidx.test:core-ktx:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-web:3.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-intents:3.6.1'
    androidTestImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    androidTestImplementation 'io.mockk:mockk-android:1.13.12'
}

tasks.findAll { it.name.contains("dokka") }.forEach {
    it.configure {
        moduleName.set("Dreams")
        moduleVersion.set(android.defaultConfig.versionName)
        dokkaSourceSets {
            named("main") {
                includes.from("module.md")
                sourceLink {
                    localDirectory.set(file("src/main/java"))
                    remoteUrl.set(URL("https://github.com/dreamstechnology/dreams-android-sdk/tree/master/sdk/"))
                    remoteLineSuffix.set("#L")
                }
                includeNonPublic.set(false)
                noAndroidSdkLink.set(false)
                reportUndocumented.set(true)
            }
        }
    }
}

task androidSourcesJar(type: Jar) {
    archiveClassifier.set('sources')
    from android.sourceSets.main.java.srcDirs
}

task javadocsJar(type: Jar, dependsOn: dokkaJavadoc) {
    archiveClassifier.set('javadoc')
    from dokkaJavadoc
}
task htmlJar(type: Jar, dependsOn: dokkaHtml) {
    archiveClassifier.set("html-doc")
    from dokkaHtml
}

mavenPublishing {
    // See: https://vanniktech.github.io/gradle-maven-publish-plugin/what/#android-library-single-variant
    configure(
            new AndroidSingleVariantLibrary(
                "release", // variant to publish
                true,      // publish sources jar
                true       // publish javadoc jar
        )
    )
    publishToMavenCentral(
            SonatypeHost.CENTRAL_PORTAL,
            true // also *release* the published artifacts
    )
    signAllPublications()
    coordinates("io.github.doconomy", "dreams-android-sdk", android.defaultConfig.versionName)
    pom {
        name = "Dreams Android SDK"
        description = ""
        inceptionYear = "2020"
        url = "https://github.com/doconomy/dreams-android-sdk"
        licenses {
            license {
                name = 'Mozilla Public License Version 2.0'
                url = 'http://mozilla.org/MPL/2.0/'
            }
        }
        developers {
            developer {
                organization = 'Doconomy'
                organizationUrl = 'https://www.doconomy.com/'
            }
        }
        scm {
            url = "https://github.com/doconomy/dreams-android-sdk"
            connection = "scm:git:git://github.com/doconomy/dreams-android-sdk.git"
            developerConnection = "scm:git:ssh://git@github.com:doconomy/dreams-android-sdk.git"
        }
    }
}
